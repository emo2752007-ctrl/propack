<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم | PRO PACK</title>
<style>
:root{--ink:#0b1f43;--blue:#1d4ed8;--bg:#f3f5f9;--card:#fff;--line:#dde3ee;--mut:#64708a;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--ink:#e8edf8;--blue:#6b95ff;--bg:#0c1424;--card:#142038;--line:#26365a;--mut:#97a4c2;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--bad)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
.login h1{margin:0 0 4px;font-size:22px}.msg{color:var(--bad);font-size:14px;min-height:22px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar strong{font-size:18px;margin-inline-end:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font-weight:700;color:var(--mut)}
nav button.on{background:var(--ink);color:var(--bg)}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat small{color:var(--mut)}.stat b{display:block;font-size:26px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:17px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}.row .grow{flex:1;min-width:220px}.row small{color:var(--mut);display:block}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.bars div{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}.bars span{width:110px}
.bars i{display:block;height:14px;border-radius:7px;background:var(--blue);min-width:3px}
.empty{color:var(--mut);padding:18px 0;text-align:center}
.toast{position:fixed;bottom:18px;inset-inline-start:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
  <h1>لوحة تحكم PRO PACK</h1><p style="color:var(--mut);margin:0 0 16px">سجّل دخولك بحساب الإدارة.</p>
  <label>البريد الإلكتروني<input id="em" type="email" autocomplete="username"></label>
  <label>كلمة المرور<input id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn" id="loginBtn" style="width:100%">تسجيل الدخول</button><div class="msg" id="loginMsg"></div>
</div>

<div id="appView" hidden>
<header><div class="bar"><strong>PRO PACK | الإدارة</strong>
<nav id="tabs"><button data-t="orders" class="on">الطلبات</button><button data-t="products">المنتجات</button><button data-t="customers">العملاء</button><button data-t="stats">الإحصائيات</button></nav>
<button class="btn ghost" id="logout">خروج</button></div></header>
<main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ضع بيانات مشروعك من Supabase > Project Settings > API
const SB_URL = 'https://qnhomguqjgbbxesoezzg.supabase.co';
const SB_KEY = 'sb_publishable_SDc0yBR-J7q7FfMFKYAJxQ_VcgQtoTy';

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('ar-EG') + ' ج.م';
const ST = {new:'جديد', confirmed:'مؤكد', shipped:'خرج للتوصيل', delivered:'تم التسليم', cancelled:'ملغي'};
const CAT = {cups:'أكواب وأغطية', sugar:'السكر والتقليب', straws:'الشاليموه', paper:'المناديل والورقيات', takeaway:'التعبئة والتيك أواي'};
let orders = [], products = [], tab = 'orders', editing = null;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return showLogin();
  const {data:a} = await sb.from('admins').select('user_id').maybeSingle();
  if(!a){await sb.auth.signOut();showLogin('هذا الحساب ليس مسجلًا كأدمن.');return}
  $('#loginView').hidden = true; $('#appView').hidden = false;
  await load(); render();
}
function showLogin(m=''){$('#appView').hidden=true;$('#loginView').hidden=false;$('#loginMsg').textContent=m}

$('#loginBtn').onclick = async () => {
  const {error} = await sb.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
  if(error) return $('#loginMsg').textContent = 'البريد أو كلمة المرور غير صحيحة.';
  boot();
};
$('#logout').onclick = async () => {await sb.auth.signOut();showLogin()};
$('#tabs').onclick = e => {const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()};

async function load(){
  const o = await sb.from('orders').select('*').order('created_at',{ascending:false});
  const p = await sb.from('products').select('*').order('name');
  if(o.error||p.error) toast('تعذر تحميل البيانات، راجع إعدادات Supabase.');
  orders = o.data || []; products = p.data || [];
}

function render(){ ({orders:vOrders, products:vProducts, customers:vCustomers, stats:vStats})[tab](); }

function vOrders(){
  const rows = orders.map(o => `<div class="row"><div class="grow"><b>${esc(o.full_name)}</b> <span class="tag">${new Date(o.created_at).toLocaleString('ar-EG')}</span>
    <small>${esc(o.phone)} · ${esc(o.city)} · ${esc(o.address)}</small>
    <small>${(o.items||[]).map(i=>esc(i.name)+' × '+esc(i.qty)).join('، ')||'بدون أصناف'}</small>
    ${o.notes?`<small>ملاحظات: ${esc(o.notes)}</small>`:''}</div>
    <b>${money(o.total)}</b>
    <select data-oid="${esc(o.id)}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`).join('');
  $('#view').innerHTML = `<div class="panel"><h2>الطلبات (${orders.length})</h2>${rows||'<div class="empty">لا توجد طلبات بعد. أول طلب هيظهر هنا.</div>'}</div>`;
}
document.addEventListener('change', async e => {
  const id = e.target.dataset?.oid; if(!id) return;
  const {error} = await sb.from('orders').update({status:e.target.value}).eq('id',id);
  if(error) return toast('تعذر تحديث الحالة');
  orders.find(o=>o.id===id).status = e.target.value; toast('تم تحديث الحالة');
});

function vProducts(){
  const p = editing ? products.find(x=>x.id===editing) : {};
  const rows = products.map(x => `<div class="row"><div class="grow"><b>${esc(x.name)}</b>
    <small>${esc(CAT[x.category]||x.category)} · ${money(x.price)}</small></div>
    ${x.featured?'<span class="tag">الأكثر طلبًا</span>':''}<span class="tag">${x.active?'ظاهر':'مخفي'}</span>
    <button class="btn ghost" data-edit="${esc(x.id)}">تعديل</button><button class="btn red" data-del="${esc(x.id)}">حذف</button></div>`).join('');
  $('#view').innerHTML = `<div class="panel"><h2>${editing?'تعديل منتج':'إضافة منتج'}</h2><div class="form">
    <label>الاسم<input id="pn" value="${esc(p.name)}"></label>
    <label>القسم<select id="pc">${Object.entries(CAT).map(([k,v])=>`<option value="${k}" ${p.category===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <label>السعر (ج.م)<input id="pp" type="number" min="0" step="0.5" value="${esc(p.price??'')}"></label>
    <label><input id="pa" type="checkbox" style="width:auto" ${p.active!==false?'checked':''}> ظاهر في المتجر</label>
    <label><input id="pf" type="checkbox" style="width:auto" ${p.featured?'checked':''}> من الأكثر طلبًا</label>
    <div><button class="btn" id="saveP">${editing?'حفظ التعديل':'إضافة المنتج'}</button> ${editing?'<button class="btn ghost" id="cancelP">إلغاء</button>':''}</div></div></div>
    <div class="panel"><h2>المنتجات (${products.length})</h2>${rows||'<div class="empty">لا توجد منتجات. أضف أول منتج من النموذج.</div>'}</div>`;
  $('#saveP').onclick = async () => {
    const rec = {name:$('#pn').value.trim(), category:$('#pc').value, price:Number($('#pp').value||0), active:$('#pa').checked, featured:$('#pf').checked};
    if(!rec.name) return toast('اكتب اسم المنتج');
    const {error} = editing ? await sb.from('products').update(rec).eq('id',editing) : await sb.from('products').insert(rec);
    if(error) return toast('تعذر الحفظ'); editing=null; await load(); vProducts(); toast('تم الحفظ');
  };
  if(editing) $('#cancelP').onclick = () => {editing=null;vProducts()};
}
$('#view').addEventListener('click', async e => {
  const ed=e.target.dataset?.edit, del=e.target.dataset?.del;
  if(ed){editing=ed;vProducts();scrollTo(0,0)}
  if(del && confirm('حذف المنتج نهائيًا؟')){const {error}=await sb.from('products').delete().eq('id',del);
    if(error) return toast('تعذر الحذف'); await load(); vProducts(); toast('تم الحذف')}
});

function vCustomers(){
  const m = {};
  orders.forEach(o => {const c = m[o.phone] ||= {name:o.full_name, phone:o.phone, city:o.city, n:0, sum:0, last:o.created_at};
    c.n++; if(o.status!=='cancelled') c.sum += Number(o.total||0);});
  const list = Object.values(m).sort((a,b)=>b.sum-a.sum);
  $('#view').innerHTML = `<div class="panel"><h2>العملاء (${list.length})</h2>${list.map(c=>`<div class="row"><div class="grow"><b>${esc(c.name)}</b>
    <small>${esc(c.phone)} · ${esc(c.city)}</small></div><span class="tag">${c.n} طلب</span><b>${money(c.sum)}</b></div>`).join('')||'<div class="empty">العملاء هيظهروا بعد أول طلب.</div>'}</div>`;
}

function vStats(){
  const valid = orders.filter(o=>o.status!=='cancelled');
  const rev = valid.reduce((s,o)=>s+Number(o.total||0),0);
  const by = Object.keys(ST).map(k=>[ST[k], orders.filter(o=>o.status===k).length]);
  const mx = Math.max(1,...by.map(x=>x[1]));
  const top = {}; valid.forEach(o=>(o.items||[]).forEach(i=>top[i.name]=(top[i.name]||0)+Number(i.qty||0)));
  const tl = Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6), tm = Math.max(1,...tl.map(x=>x[1]));
  const bars = a => a.map(([k,v],_,arr)=>`<div><span>${esc(k)}</span><i style="width:${v/(a===by?mx:tm)*60}%"></i><b>${v}</b></div>`).join('');
  $('#view').innerHTML = `<div class="grid"><div class="stat"><small>إجمالي الطلبات</small><b>${orders.length}</b></div>
    <div class="stat"><small>طلبات جديدة</small><b>${orders.filter(o=>o.status==='new').length}</b></div>
    <div class="stat"><small>قيمة المبيعات</small><b>${money(rev)}</b></div>
    <div class="stat"><small>متوسط الطلب</small><b>${money(valid.length?rev/valid.length:0)}</b></div></div>
    <div class="panel"><h2>الطلبات حسب الحالة</h2><div class="bars">${bars(by)}</div></div>
    <div class="panel"><h2>الأكثر مبيعًا (بالكمية)</h2><div class="bars">${tl.length?bars(tl):'<div class="empty">لا توجد مبيعات بعد.</div>'}</div></div>`;
}

boot();
</script>
</body>
</html>
